<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<script>
"use strict";
const SEED = __SEED__;
const SCHEMA_VERSION = 1;
const { useState, useEffect, useMemo, useRef, useCallback } = React;
const html = htm.bind(React.createElement);

/* ---------------- Fiktive Demo-Konten (Simulation, keine Passwörter) ---------------- */
const ACCOUNTS = [
  { id: "demo-lehrkraft-a", name: "Frau Sonnenberg", note: "Klassenleitung 1a (fiktiv)" },
  { id: "demo-lehrkraft-b", name: "Herr Lindner", note: "Klassenleitung 1b (fiktiv)" },
];
const ACCOUNT_IDS = new Set(ACCOUNTS.map(a => a.id));

const TYPE_LABEL = { worksheet: "Arbeitsblatt", lesson_plan: "Unterrichtsplan", assessment: "Lernstandskontrolle" };
const LEVEL_LABEL = { basis: "Basis", standard: "Standard", erweitert: "Erweitert", differenziert: "Differenziert (3 Niveaus)" };
const STATUS = { planned: ["○", "Geplant"], started: ["◐", "Begonnen"], completed: ["●", "Abgeschlossen"] };
const byId = (list) => Object.fromEntries(list.map(x => [x.id, x]));
const TOPICS = byId(SEED.topics), MATERIALS = byId(SEED.materials), SUBJECTS = byId(SEED.subjects), CURR = byId(SEED.curriculum);

/* ---------------- Datum / Kalender (gleiche Regeln wie Pilot, F05) ---------------- */
const P = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const F = (d) => d.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = P(s); d.setUTCDate(d.getUTCDate() + n); return F(d); };
const wd = (s) => (P(s).getUTCDay() + 6) % 7;
const monday = (s) => addDays(s, -wd(s));
const todayBerlin = () => new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Berlin" }).format(new Date());
const fmt = (s, y = true) => new Intl.DateTimeFormat("de-DE", { day: "2-digit", month: "2-digit", ...(y ? { year: "numeric" } : {}), timeZone: "UTC" }).format(P(s));
function isoWeek(s) {
  const d = P(s); const day = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - day + 3);
  const year = d.getUTCFullYear(); const jan4 = new Date(Date.UTC(year, 0, 4));
  return { year, week: 1 + Math.round(((d - jan4) / 86400000 - 3 + ((jan4.getUTCDay() + 6) % 7)) / 7) };
}
const YEAR = SEED.school_year;
const CLOSED = SEED.closures.map(c => [c.starts_on, c.ends_on]);
const isClosed = (s) => CLOSED.some(([a, b]) => a <= s && s <= b);
const isTeaching = (s, cls) => s >= YEAR.starts_on && s <= YEAR.ends_on && cls.weekdays.includes(wd(s)) && !isClosed(s);
const teachingDays = (m, cls) => [0,1,2,3,4,5,6].map(i => addDays(m, i)).filter(d => isTeaching(d, cls));
function weekNumbers(cls) {
  const out = {}; let n = 0;
  for (let w = monday(YEAR.starts_on); w <= monday(YEAR.ends_on); w = addDays(w, 7)) if (teachingDays(w, cls).length) out[w] = ++n;
  return out;
}
function weekInfo(m, cls, nums) {
  const end = addDays(m, 6); const inYear = !(end < YEAR.starts_on || m > YEAR.ends_on);
  const days = inYear ? teachingDays(m, cls) : []; const regular = cls.weekdays.length;
  const closures = SEED.closures.filter(c => !(c.ends_on < m || c.starts_on > end));
  return { start: m, end, iso: isoWeek(m), inYear, number: inYear ? (nums[m] ?? null) : null, days, regular,
    shortened: inYear && days.length > 0 && days.length < regular, free: inYear && days.length === 0, closures,
    cap: (h) => regular ? Math.floor(h * days.length / regular) : 0 };
}

/* ---------------- Planung (F06) ---------------- */
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "u" + Date.now() + Math.random().toString(16).slice(2));
function initPlan(cls) {
  const nums = weekNumbers(cls); const weeks = Object.keys(nums).sort(); const units = [];
  for (const tpl of SEED.templates) {
    const hours = cls.hours[tpl.subject_id] ?? 0;
    const caps = weeks.map(w => [w, weekInfo(w, cls, nums).cap(hours)]);
    let i = 0, used = 0, seq = 0;
    for (const tid of tpl.topics) {
      let rest = TOPICS[tid].estimated_lessons;
      while (rest > 0) {
        while (i < caps.length && caps[i][1] - used <= 0) { i++; used = 0; }
        if (i >= caps.length) break;
        const take = Math.min(rest, caps[i][1] - used);
        const mats = SEED.materials.filter(m => m.topic_id === tid).map(m => m.id);
        units.push({ id: uid(), class_id: cls.id, subject_id: tpl.subject_id, topic_id: tid, week_start_date: caps[i][0],
          planned_lessons: take, status: "planned", notes: "", sequence: ++seq, material_ids: mats, curriculum_ids: [...TOPICS[tid].curriculum_ids], version: 1 });
        used += take; rest -= take;
      }
    }
  }
  return units;
}
function warningsFor(cls, units, subjectId, week, lessons, excludeId) {
  const info = weekInfo(week, cls, weekNumbers(cls));
  if (!info.inYear) return ["Die Zielwoche liegt außerhalb des Schuljahrs."];
  if (info.free) return ["Die Zielwoche ist vollständig unterrichtsfrei (Ferien oder schulfreie Tage)."];
  const cap = info.cap(cls.hours[subjectId] ?? 0);
  const used = units.filter(u => u.class_id === cls.id && u.subject_id === subjectId && u.week_start_date === week && u.id !== excludeId).reduce((a, u) => a + u.planned_lessons, 0);
  return used + lessons > cap ? [`Überplanung: ${used + lessons} Stunden bei einer Kapazität von ${cap} Stunden in dieser Woche.`] : [];
}

/* ---------------- Empfehlungen (F07): 100 Thema, +20 Kompetenz, +5 Niveau ---------------- */
function scoreTopic(tid, comps, level) {
  return SEED.materials.filter(m => m.topic_id === tid && m.status === "released").map(m => {
    let score = 100; const r = [`Thema „${TOPICS[tid].title}“ ist eingeplant (+100)`];
    const shared = m.curriculum_ids.filter(c => comps.has(c));
    if (shared.length) { score += 20; r.push(`gemeinsamer Kompetenzbezug ${shared.map(c => CURR[c].section_code).sort().join(", ")} (+20)`); }
    if (level && m.level === level) { score += 5; r.push(`Niveau ${LEVEL_LABEL[level]} (+5)`); }
    return { m, score, reason: r.join("; ") };
  });
}
const sortRec = (a, b) => b.score - a.score || a.m.title.localeCompare(b.m.title, "de") || (a.m.id < b.m.id ? -1 : 1);
function recommend(cls, units, week, level) {
  const mine = units.filter(u => u.class_id === cls.id).sort((a, b) => a.week_start_date.localeCompare(b.week_start_date) || a.sequence - b.sequence);
  return SEED.subjects.map(s => {
    const wu = mine.filter(u => u.subject_id === s.id && u.week_start_date === week);
    if (wu.length) {
      const comps = {}; wu.forEach(u => { (comps[u.topic_id] ||= new Set()); u.curriculum_ids.forEach(c => comps[u.topic_id].add(c)); });
      const items = Object.keys(comps).flatMap(t => scoreTopic(t, comps[t], level)).sort(sortRec).slice(0, 5);
      return { s, mode: "planned", items };
    }
    const open = mine.filter(u => u.subject_id === s.id && u.status !== "completed");
    const next = open.find(u => u.week_start_date > week) ?? open[0];
    if (!next) return { s, mode: "empty", items: [] };
    const items = scoreTopic(next.topic_id, new Set(next.curriculum_ids), level).sort(sortRec).slice(0, 5);
    return { s, mode: "next", next, items };
  });
}

/* ---------------- Datenzugriffsschicht (austauschbar) ----------------
   Gleiche Schnittstelle wie eine spätere REST-Anbindung: load() / save(state).
   1) Persönlicher Artifact-Speicher (db, privat je Person)  2) Fallback: nur diese Sitzung. */
const emptyState = () => ({ schema_version: SCHEMA_VERSION, classes: [], units: [], favorites: [] });
function sessionStore() {
  let mem = emptyState();
  return { mode: "session", label: "Nur diese Sitzung – Daten gehen beim Neuladen verloren", load: async () => mem, save: async (s) => { mem = s; } };
}
async function createStore() {
  try {
    if (!window.claude?.use) return sessionStore();
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return sessionStore();
    const id = await user.id();
    if (!id) return sessionStore();
    const ref = db.doc("data/users/" + id + "/demo-state");
    const snap = await ref.get();
    return {
      mode: "personal", label: "Persönlicher Speicher in Claude – bleibt nach Neuladen erhalten, nur für Sie sichtbar",
      load: async () => (snap.exists ? JSON.parse(JSON.stringify(snap.data())) : emptyState()),
      save: async (s) => { await ref.set(s); },
    };
  } catch (e) { return sessionStore(); }
}

/* ---------------- JSON-Export / validierter Import ---------------- */
function exportJson(state) {
  return JSON.stringify({ schema_version: SCHEMA_VERSION, exported_at: new Date().toISOString(),
    topics: SEED.topics.map(({ key, estimated_lessons, ...t }) => t),
    materials: SEED.materials.map(({ key, has_solution, ...m }) => m),
    classes: state.classes, units: state.units, favorites: state.favorites }, null, 2);
}
const isDate = (s) => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s) && F(P(s)) === s;
function validateImport(text) {
  const errors = []; let data;
  try { data = JSON.parse(text); } catch { return { errors: ["Kein gültiges JSON."] }; }
  if (!data || typeof data !== "object" || Array.isArray(data)) return { errors: ["JSON-Objekt erwartet."] };
  if (data.schema_version !== SCHEMA_VERSION) errors.push(`schema_version ${SCHEMA_VERSION} erwartet.`);
  for (const k of ["topics", "materials", "classes", "units", "favorites"]) if (!Array.isArray(data[k])) errors.push(`„${k}“ muss eine Liste sein.`);
  if (errors.length) return { errors };
  for (const k of Object.keys(data)) if (/pass|token|secret/i.test(k)) errors.push(`Unzulässiges Feld „${k}“ (keine Passwörter oder Tokens).`);
  data.topics.forEach((t, i) => { if (!TOPICS[t?.id]) errors.push(`topics.${i}: unbekannte Themen-ID.`); });
  data.materials.forEach((m, i) => { if (!MATERIALS[m?.id]) errors.push(`materials.${i}: unbekannte Material-ID.`); });
  const classIds = new Set(); const owners = {};
  data.classes.forEach((c, i) => {
    const p = `classes.${i}`;
    if (typeof c?.id !== "string" || !c.id) errors.push(`${p}.id fehlt.`); else if (classIds.has(c.id)) errors.push(`${p}.id doppelt.`); else { classIds.add(c.id); owners[c.id] = c.owner_id; }
    if (!ACCOUNT_IDS.has(c?.owner_id)) errors.push(`${p}.owner_id ist kein Demo-Konto.`);
    if (typeof c?.name !== "string" || !c.name.trim()) errors.push(`${p}.name fehlt.`);
    if (!Array.isArray(c?.weekdays) || !c.weekdays.length || c.weekdays.some(d => !Number.isInteger(d) || d < 0 || d > 6)) errors.push(`${p}.weekdays ungültig (0–6, mindestens ein Tag).`);
    if (!c?.hours || typeof c.hours !== "object" || Object.entries(c.hours).some(([s, h]) => !SUBJECTS[s] || !Number.isInteger(h) || h < 0)) errors.push(`${p}.hours ungültig.`);
  });
  data.units.forEach((u, i) => {
    const p = `units.${i}`;
    if (typeof u?.id !== "string" || !u.id) errors.push(`${p}.id fehlt.`);
    if (!classIds.has(u?.class_id)) errors.push(`${p}.class_id verweist auf keine Klasse im Import.`);
    if (!TOPICS[u?.topic_id]) errors.push(`${p}.topic_id unbekannt.`);
    else if (TOPICS[u.topic_id].subject_id !== u.subject_id) errors.push(`${p}: Fach passt nicht zum Thema.`);
    if (!isDate(u?.week_start_date) || wd(u.week_start_date) !== 0) errors.push(`${p}.week_start_date muss ein Montag (JJJJ-MM-TT) sein.`);
    if (!Number.isInteger(u?.planned_lessons) || u.planned_lessons < 1) errors.push(`${p}.planned_lessons muss eine positive ganze Zahl sein.`);
    if (!STATUS[u?.status]) errors.push(`${p}.status ungültig.`);
    if (!Array.isArray(u?.material_ids) || u.material_ids.some(m => !MATERIALS[m])) errors.push(`${p}.material_ids enthält unbekannte IDs.`);
    if (!Array.isArray(u?.curriculum_ids) || u.curriculum_ids.some(c => !CURR[c])) errors.push(`${p}.curriculum_ids enthält unbekannte IDs.`);
  });
  data.favorites.forEach((f, i) => {
    if (!ACCOUNT_IDS.has(f?.owner_id)) errors.push(`favorites.${i}.owner_id ist kein Demo-Konto.`);
    if (!MATERIALS[f?.material_id]) errors.push(`favorites.${i}.material_id unbekannt.`);
  });
  if (errors.length) return { errors };
  return { errors: [], state: { schema_version: SCHEMA_VERSION,
    classes: data.classes.map(c => ({ id: c.id, owner_id: c.owner_id, name: c.name.trim(), school_year_id: YEAR.id, weekdays: [...new Set(c.weekdays)].sort(), hours: c.hours })),
    units: data.units.map(u => ({ ...u, notes: String(u.notes ?? ""), sequence: Number(u.sequence) || 0, version: Number(u.version) || 1 })),
    favorites: data.favorites.map(f => ({ owner_id: f.owner_id, material_id: f.material_id })) } };
}

function UnitModal({ cls, units, unit, defaultWeek, moveOnly, onSave, onDelete, onClose }) {
  const isNew = !unit;
  const [d, setD] = useState(() => unit ? { ...unit } : { id: uid(), class_id: cls.id, subject_id: SEED.subjects[0].id, topic_id: SEED.topics.find(t => t.subject_id === SEED.subjects[0].id).id,
    week_start_date: defaultWeek, planned_lessons: 1, status: "planned", notes: "", sequence: 0, material_ids: [], curriculum_ids: [], version: 1 });
  const [warn, setWarn] = useState(null); const [conf, setConf] = useState(false);
  const dateRef = useRef(null);
  useEffect(() => { (moveOnly ? dateRef.current : null)?.focus(); const k = e => e.key === "Escape" && onClose(); window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, []);
  const set = (p) => { setD({ ...d, ...p }); setWarn(null); };
  const topics = SEED.topics.filter(t => t.subject_id === d.subject_id);
  const mats = SEED.materials.filter(m => m.topic_id === d.topic_id);
  const save = (force) => {
    const week = monday(d.week_start_date);
    const unchanged = unit && unit.week_start_date === week && unit.planned_lessons >= d.planned_lessons;
    const w = unchanged ? [] : warningsFor(cls, units, d.subject_id, week, d.planned_lessons, d.id);
    if (w.length && !force) { setWarn(w); return; }
    onSave({ ...d, week_start_date: week });
  };
  const toggle = (k, id) => set({ [k]: d[k].includes(id) ? d[k].filter(x => x !== id) : [...d[k], id] });
  return html`<div class="overlay" onClick=${e => e.target === e.currentTarget && onClose()}>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
      <div class="between"><h2 id="mt">${isNew ? "Einheit hinzufügen" : moveOnly ? "Einheit verschieben" : "Einheit bearbeiten"}</h2>
        <button class="btn ghost" onClick=${onClose} aria-label="Schließen">✕</button></div>
      ${warn ? html`<${Note} k="warn">${warn.map(x => html`<p key=${x}>${x}</p>`)}<p>Sie entscheiden, ob trotzdem gespeichert wird.</p></${Note}>` : null}
      <div class="fgrid">
        <label class="f">Fach<select id="u-subj" disabled=${!isNew} value=${d.subject_id} onChange=${e => { const t = SEED.topics.find(x => x.subject_id === e.target.value); set({ subject_id: e.target.value, topic_id: t.id, material_ids: [], curriculum_ids: [] }); }}>
          ${SEED.subjects.map(s => html`<option key=${s.id} value=${s.id}>${s.title}</option>`)}</select></label>
        <label class="f">Thema<select id="u-topic" value=${d.topic_id} onChange=${e => set({ topic_id: e.target.value, material_ids: [] })}>
          ${topics.map(t => html`<option key=${t.id} value=${t.id}>${t.title}</option>`)}</select></label>
        <label class="f">Woche (beliebiges Datum)<input id="u-week" ref=${dateRef} type="date" value=${d.week_start_date} onChange=${e => e.target.value && set({ week_start_date: e.target.value })} />
          <span class="small muted" style=${{ fontWeight: 400 }}>Woche ab Montag, ${fmt(monday(d.week_start_date))}</span></label>
        <label class="f">Stunden (à 45 Min.)<input id="u-les" type="number" min="1" max="60" inputMode="numeric" value=${d.planned_lessons} onChange=${e => set({ planned_lessons: Math.max(1, parseInt(e.target.value) || 1) })} /></label>
        <label class="f">Status<select id="u-stat" value=${d.status} onChange=${e => set({ status: e.target.value })}>
          ${Object.entries(STATUS).map(([k, v]) => html`<option key=${k} value=${k}>${v[1]}</option>`)}</select></label>
      </div>
      ${!moveOnly ? html`
        <label class="f">Notizen (z. B. Lehrwerk, Buchstabenfolge)<textarea id="u-notes" style=${{ fontFamily: "inherit", fontSize: "16px", minHeight: "70px" }} value=${d.notes} onChange=${e => set({ notes: e.target.value })}></textarea></label>
        <fieldset class="card" style=${{ padding: "8px 12px" }}><legend class="small"><b>Verknüpfte Materialien</b></legend>
          ${mats.length ? mats.map(m => html`<label key=${m.id} class="chk"><input type="checkbox" checked=${d.material_ids.includes(m.id)} onChange=${() => toggle("material_ids", m.id)} /><span>${m.title} <span class="muted small">· ${TYPE_LABEL[m.type]}</span></span></label>`) : html`<p class="small muted">Für dieses Thema gibt es noch kein freigegebenes Material.</p>`}</fieldset>
        <fieldset class="card" style=${{ padding: "8px 12px" }}><legend class="small"><b>Kompetenzbezüge (LehrplanPLUS 1/2, ungeprüft)</b></legend>
          ${SEED.curriculum.filter(c => c.subject_id === d.subject_id).map(c => html`<label key=${c.id} class="chk"><input type="checkbox" checked=${d.curriculum_ids.includes(c.id)} onChange=${() => toggle("curriculum_ids", c.id)} /><span><b>${c.section_code}</b> ${c.section_title}</span></label>`)}</fieldset>` : null}
      <div class="row">
        ${!isNew && onDelete ? (conf ? html`<button class="btn danger" onClick=${() => onDelete(d.id)}>Wirklich löschen</button>` : html`<button class="btn danger" onClick=${() => setConf(true)}>Löschen</button>`) : null}
        <span style=${{ flex: 1 }}></span>
        <button class="btn ghost" onClick=${onClose}>Abbrechen</button>
        ${warn ? html`<button class="btn primary" onClick=${() => save(true)}>Trotzdem speichern</button>` : html`<button class="btn primary" onClick=${() => save(false)}>Speichern</button>`}
      </div>
    </div></div>`;
}

function Library({ ctx }) {
  const { favs, toggleFav, openMat } = ctx;
  const [q, setQ] = useState(""); const [f, setF] = useState({ subject: [], topic: [], level: [], type: [] }); const [panel, setPanel] = useState(false); const [sort, setSort] = useState("relevance");
  const tog = (k, v) => setF({ ...f, [k]: f[k].includes(v) ? f[k].filter(x => x !== v) : [...f[k], v] });
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const rel = (m) => terms.reduce((a, t) => a + (m.title.toLowerCase().includes(t) ? 3 : 0) + (m.keywords.toLowerCase().includes(t) ? 2 : 0) + (m.description.toLowerCase().includes(t) ? 1 : 0), 0);
  const items = SEED.materials.filter(m => m.status === "released"
    && (!f.subject.length || f.subject.includes(TOPICS[m.topic_id].subject_id)) && (!f.topic.length || f.topic.includes(m.topic_id))
    && (!f.level.length || f.level.includes(m.level)) && (!f.type.length || f.type.includes(m.type))
    && terms.every(t => (m.title + " " + m.description + " " + m.keywords).toLowerCase().includes(t)))
    .sort((a, b) => (sort === "relevance" && terms.length ? rel(b) - rel(a) : 0) || a.title.localeCompare(b.title, "de"));
  const group = (title, k, opts) => html`<fieldset style=${{ border: 0, padding: 0, margin: 0 }}><legend><b>${title}</b></legend>${opts.map(([v, l]) => html`<label key=${v} class="chk"><input type="checkbox" checked=${f[k].includes(v)} onChange=${() => tog(k, v)} /><span>${l}</span></label>`)}</fieldset>`;
  const active = Object.values(f).reduce((a, x) => a + x.length, 0);
  const topicOpts = SEED.topics.filter(t => !f.subject.length || f.subject.includes(t.subject_id)).map(t => [t.id, t.title]);
  const filters = html`<div class="card stack">
    ${group("Fach", "subject", SEED.subjects.map(s => [s.id, s.title]))}${group("Thema", "topic", topicOpts)}
    ${group("Niveau", "level", Object.entries(LEVEL_LABEL))}${group("Materialtyp", "type", Object.entries(TYPE_LABEL))}
    <div class="row"><button class="btn ghost" onClick=${() => setF({ subject: [], topic: [], level: [], type: [] })}>Zurücksetzen</button>
      <button class="btn primary mob" onClick=${() => setPanel(false)}>${items.length} Treffer anzeigen</button></div></div>`;
  const narrow = typeof window !== "undefined" && window.innerWidth < 900;
  return html`<div class="stack">
    <h1>Materialbibliothek</h1>
    <form class="row" role="search" onSubmit=${e => e.preventDefault()}><label class="sr" for="q">Suche in Titel, Beschreibung und Schlagwörtern</label>
      <input id="q" type="search" placeholder="Suchen (Titel, Beschreibung, Schlagwörter)" style=${{ flex: "1 1 220px", width: "auto" }} value=${q} onInput=${e => setQ(e.target.value)} />

          <dl style=${{ display: "grid", gridTemplateColumns: "minmax(110px,max-content) 1fr", gap: "4px 12px", margin: 0 }}>
            <dt class="muted">Thema (Pilotplanung)</dt><dd style=${{ margin: 0 }}>${TOPICS[m.topic_id].title}</dd>

            <dt class="muted">Freigabestand</dt><dd style=${{ margin: 0 }}>Technische Demo-Freigabe, keine fachliche Prüfung</dd>
            <dt class="muted">Schlagwörter</dt><dd style=${{ margin: 0 }}>${m.keywords}</dd></dl></section>
        <section class="card stack"><h2>Offizieller Lehrplanbezug</h2><p class="small muted">LehrplanPLUS Bayern, Jgst. 1/2, sinngemäß. Die Zuordnung zu Klasse 1 ist eine pädagogische Pilotplanung.</p>
          ${m.curriculum_ids.map(c => html`<div key=${c}><b>${CURR[c].section_code}</b> ${CURR[c].section_title}<br />${CURR[c].paraphrased_goal}<br /><span class="small muted">⚠ ungeprüft · <a href=${CURR[c].source_url} target="_blank" rel="noopener noreferrer">Quelle (online)</a></span></div>`)}</section>
      </div>
      <section class="card stack"><h2>Material</h2>

          <button class=${"btn" + (view === "main" ? " primary" : "")} aria-pressed=${view === "main"} onClick=${() => setView("main")}>Schülerblatt</button>
          <button class=${"btn" + (view === "solution" ? " primary" : "")} aria-pressed=${view === "solution"} onClick=${() => setView("solution")}>${solLabel}</button></div>`

      <h2 id="ct">${myClasses.some(c => c.id === edit.id) ? "Klasse bearbeiten" : "Klasse anlegen"}</h2>

      <p class="small muted">Im Pilot fest: Schuljahr ${YEAR.label}, Jahrgangsstufe 1, Bayern, Grundschule.</p>
      <fieldset style=${{ border: 0, padding: 0, margin: 0 }}><legend><b>Unterrichtstage</b></legend><div class="row">${DAYS.map((d, i) => html`<label key=${d} class="chk" style=${{ marginRight: "10px" }}><input type="checkbox" checked=${edit.weekdays.includes(i)} onChange=${() => setEdit({ ...edit, weekdays: edit.weekdays.includes(i) ? edit.weekdays.filter(x => x !== i) : [...edit.weekdays, i].sort() })} />${d}</label>`)}</div>
        ${edit.weekdays.length ? null : html`<p class="small" style=${{ color: "var(--err)" }}>⚠ Mindestens ein Wochentag ist erforderlich.</p>`}</fieldset>
      <div class="fgrid">${SEED.subjects.map(s => html`<label key=${s.id} class="f">Wochenstunden ${s.title}<input type="number" min="0" max="20" inputMode="numeric" value=${edit.hours[s.id] ?? 0} onChange=${e => setEdit({ ...edit, hours: { ...edit.hours, [s.id]: Math.max(0, parseInt(e.target.value) || 0) } })} /></label>`)}</div>
      <div class="row"><span style=${{ flex: 1 }}></span><button type="button" class="btn ghost" onClick=${() => setEdit(null)}>Abbrechen</button><button class="btn primary" disabled=${!edit.name.trim() || !edit.weekdays.length}>Speichern</button></div>
    </form></div>` : null}
  </div>`;
}

function DataPage({ ctx }) {
  const { state, store, replaceState, downloads, resetAll } = ctx;
  const [text, setText] = useState(""); const [res, setRes] = useState(null); const [copied, setCopied] = useState(""); const [conf, setConf] = useState(false);
  const json = useMemo(() => exportJson(state), [state]);
  const copy = async () => { try { await navigator.clipboard.writeText(json); setCopied("In die Zwischenablage kopiert."); } catch { const t = document.getElementById("exp"); t.focus(); t.select(); setCopied("Text markiert – bitte mit Strg+C / ⌘C kopieren."); } };
  const save = async () => { try { await downloads.save({ filename: "unterrichtsassistent-demo.json", data: json }); setCopied("Datei gespeichert."); } catch (e) { setCopied(e?.code === "declined" ? "Speichern abgebrochen." : "Speichern nicht möglich – bitte Text kopieren."); } };
  const readFile = (file) => { if (!file) return; const r = new FileReader(); r.onload = () => { setText(String(r.result)); setRes(null); }; r.readAsText(file); };
  return html`<div class="stack">
    <h1>Daten & Speicher</h1>
    <section class="card stack"><h2>Speichermodus</h2>
      <div class="storage"><span class=${"dot" + (store.mode === "personal" ? " ok" : "")} aria-hidden="true"></span><span>${store.label}</span></div>
      <p class="small muted">Gespeichert werden Klassen, Pläne und Merkliste aller Demo-Konten in diesem Browser-Profil bzw. Ihrem persönlichen Claude-Speicher. Keine Passwörter, keine Schülerdaten. Bitte keine vertraulichen Daten eingeben.</p>
      <div>${conf ? html`<button class="btn danger" onClick=${() => { resetAll(); setConf(false); }}>Wirklich alle Demo-Daten löschen</button>` : html`<button class="btn danger" onClick=${() => setConf(true)}>Alle Demo-Daten zurücksetzen</button>`}</div></section>
    <section class="card stack"><h2>JSON-Export</h2>
      <p class="small muted">Enthält schema_version, topics, materials, classes, units und favorites – dasselbe Format, das der lokale Pilot importiert (Materialien dort zunächst als Entwurf).</p>
      <div class="row"><button class="btn primary" onClick=${copy}>Kopieren</button>${downloads ? html`<button class="btn" onClick=${save}>Als Datei speichern</button>` : null}${copied ? html`<span class="small" role="status">${copied}</span>` : null}</div>
      <textarea id="exp" readOnly value=${json} rows="8"></textarea></section>
    <section class="card stack"><h2>JSON-Import</h2>
      <p class="small muted">Geprüft werden Schema, Datentypen, referenzierte IDs (Themen, Materialien, Kompetenzen, Klassen) und die Eigentümerzuordnung zu den Demo-Konten. Bei Fehlern wird nichts übernommen.</p>
      <label class="f">Datei wählen<input id="imp-file" type="file" accept="application/json,.json" onChange=${e => readFile(e.target.files?.[0])} /></label>
      <label class="f">oder JSON einfügen<textarea id="imp" value=${text} onInput=${e => { setText(e.target.value); setRes(null); }} placeholder='{"schema_version": 1, ...}'></textarea></label>
      <div class="row"><button class="btn" disabled=${!text.trim()} onClick=${() => setRes(validateImport(text))}>Prüfen</button>
        <button class="btn primary" disabled=${!res || res.errors.length > 0} onClick=${() => { replaceState(res.state); setRes({ errors: [], done: true }); setText(""); }}>Übernehmen (ersetzt aktuelle Daten)</button></div>
      ${res ? (res.done ? html`<${Note} k="ok">Import übernommen.</${Note}>` : res.errors.length ? html`<${Note} k="err"><p>${res.errors.length} Fehler – nichts übernommen:</p><ul style=${{ margin: 0, paddingLeft: "20px" }}>${res.errors.slice(0, 30).map((e, i) => html`<li key=${i}>${e}</li>`)}</ul></${Note}>`
        : html`<${Note} k="ok">Keine Fehler: ${res.state.classes.length} Klassen, ${res.state.units.length} Einheiten, ${res.state.favorites.length} Merklisten-Einträge.</${Note}>`) : null}
    </section></div>`;
}

function Entry({ onPick, store }) {

/* ---------------- App ---------------- */
function App() {
  const [store, setStore] = useState(null);
  const [state, setState] = useState(emptyState());
  const [loaded, setLoaded] = useState(false);
  const [downloads, setDownloads] = useState(null);
  const [account, setAccount] = useState(null);
  const [page, setPage] = useState("dash"); const [hist, setHist] = useState([]);
  const [matId, setMatId] = useState(null);
  const [classId, setClassId] = useState(null);
  const [week, setWeek] = useState(() => { const t = monday(todayBerlin()); return t < monday(YEAR.starts_on) ? "2026-09-21" : t; });
  const [modal, setModal] = useState(null); const [saveErr, setSaveErr] = useState(null);
  const saveTimer = useRef(null); const dirty = useRef(false);

  useEffect(() => { (async () => {
    const s = await createStore(); setStore(s);
    try { setState(await s.load()); } catch { setState(emptyState()); }
    setLoaded(true);
    try { setDownloads(window.claude?.use ? await window.claude.use("downloads") : null); } catch { setDownloads(null); }
  })(); }, []);
  useEffect(() => {
    if (!loaded || !dirty.current) return;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => { try { await store.save(state); setSaveErr(null); } catch (e) { setSaveErr("Speichern fehlgeschlagen – Änderungen gelten nur für diese Sitzung."); } }, 600);
  }, [state, loaded]);
  const mutate = (fn) => { dirty.current = true; setState(s => fn(JSON.parse(JSON.stringify(s)))); };

  const myClasses = account ? state.classes.filter(c => c.owner_id === account.id) : [];
  const cls = myClasses.find(c => c.id === classId) ?? myClasses[0] ?? null;
  const myClassIds = new Set(myClasses.map(c => c.id));
  const units = state.units.filter(u => myClassIds.has(u.class_id));
  const favs = new Set(account ? state.favorites.filter(f => f.owner_id === account.id).map(f => f.material_id) : []);

  const go = (p) => { if (p === "back") { const h = [...hist]; const last = h.pop() ?? "dash"; setHist(h); setPage(last); return; } setHist(h => [...h, page]); setPage(p); window.scrollTo(0, 0); };
  const ctx = {
    state, store, account, myClasses, cls, units, week, setWeek, favs, downloads, go, setModal,
    setClassId,
    openMat: (id) => { setMatId(id); go("mat"); },
    toggleFav: (id) => mutate(s => { const i = s.favorites.findIndex(f => f.owner_id === account.id && f.material_id === id); if (i >= 0) s.favorites.splice(i, 1); else s.favorites.push({ owner_id: account.id, material_id: id }); return s; }),
    updateUnit: (u) => mutate(s => { s.units = s.units.map(x => x.id === u.id ? { ...u, version: (x.version || 1) + 1 } : x); return s; }),
    saveClass: (c) => { mutate(s => { const i = s.classes.findIndex(x => x.id === c.id); if (i >= 0) s.classes[i] = c; else s.classes.push(c); return s; }); setClassId(c.id); },
    deleteClass: (id) => mutate(s => { s.classes = s.classes.filter(c => c.id !== id); s.units = s.units.filter(u => u.class_id !== id); return s; }),
    replaceState: (ns) => mutate(() => ns),
    resetAll: () => mutate(() => emptyState()),
  };
  const nav = [["dash", "Übersicht"], ["plan", "Wochenplan"], ["lib", "Bibliothek"], ["fav", "Merkliste"], ["classes", "Klassen"], ["data", "Daten"]];

  if (!account) return html`<${Entry} store=${store} onPick=${a => { setAccount(a); setPage(state.classes.some(c => c.owner_id === a.id) ? "dash" : "classes"); }} />`;
  const replaceUnits = (fn) => mutate(s => { s.units = fn(s.units); return s; });
  return html`<div>
    <header class="bar"><div class="bar-in">
      <div class="brand"><span>Unterrichtsassistent</span><span class="sim">Demo</span></div>
      <nav class="nav" aria-label="Hauptnavigation">${nav.map(([k, l]) => html`<button key=${k} aria-current=${page === k ? "page" : undefined} onClick=${() => { setHist([]); setPage(k); }}>${l}</button>`)}
        <button onClick=${() => { setAccount(null); setPage("dash"); setHist([]); }} title="Simulierte Abmeldung">${account.name} · Wechseln</button></nav>
    </div></header>
    <main class="wrap">
      <div class="storage" title="Aktiver Speichermodus"><span class=${"dot" + (store?.mode === "personal" ? " ok" : "")} aria-hidden="true"></span><span>${store?.label}</span></div>
      ${saveErr ? html`<${Note} k="err">${saveErr}</${Note}>` : null}
      ${page === "dash" ? html`<${Dashboard} ctx=${ctx} />` : page === "plan" ? html`<${PlanPage} ctx=${ctx} />` : page === "lib" ? html`<${Library} ctx=${ctx} />`
        : page === "mat" ? html`<${MaterialPage} key=${matId} ctx=${ctx} id=${matId} />` : page === "fav" ? html`<${Favorites} ctx=${ctx} />` : page === "classes" ? html`<${Classes} ctx=${ctx} />` : html`<${DataPage} ctx=${ctx} />`}
    </main>
    ${modal?.kind === "unit" && cls ? html`<${UnitModal} cls=${cls} units=${units} unit=${modal.unit} defaultWeek=${modal.defaultWeek ?? week} moveOnly=${modal.moveOnly}
        onClose=${() => setModal(null)} onDelete=${(id) => { replaceUnits(us => us.filter(u => u.id !== id)); setModal(null); }}
        onSave=${(u) => { replaceUnits(us => us.some(x => x.id === u.id) ? us.map(x => x.id === u.id ? { ...u, version: (x.version || 1) + 1 } : x) : [...us, { ...u, sequence: us.filter(x => x.class_id === u.class_id && x.subject_id === u.subject_id).length + 1 }]); setModal(null); }} />` : null}
    ${modal?.kind === "init" && cls ? html`<${InitModal} cls=${cls} has=${units.some(u => u.class_id === cls.id)} onClose=${() => setModal(null)} onRun=${(replace) => { replaceUnits(us => [...us.filter(u => u.class_id !== cls.id || !replace), ...initPlan(cls)]); setModal(null); }} />` : null}
  </div>`;
}

function InitModal({ cls, has, onClose, onRun }) {
  const [rep, setRep] = useState(false);
  return html`<div class="overlay" onClick=${e => e.target === e.currentTarget && onClose()}><div class="modal" role="dialog" aria-modal="true" aria-labelledby="it">
    <h2 id="it">Plan aus Vorlage anlegen</h2>
    <p>Die Pilotvorlagen für Deutsch und Mathematik werden in den Plan von <b>${cls.name}</b> kopiert und nacheinander auf die Unterrichtswochen verteilt. Ferien bleiben frei, verkürzte Wochen erhalten anteilig weniger Stunden.</p>
    <${Note}>Die Startinhalte decken nur einen Teil des Schuljahrs ab (ca. 17 Wochen je Fach).</${Note}>
    ${has ? html`<${Note} k="warn"><p>Der Plan enthält bereits Einheiten.</p><label class="chk"><input type="checkbox" checked=${rep} onChange=${e => setRep(e.target.checked)} /> Ja, vorhandene Einheiten ersetzen</label></${Note}>` : null}
    <div class="row"><span style=${{ flex: 1 }}></span><button class="btn ghost" onClick=${onClose}>Abbrechen</button><button class="btn primary" disabled=${has && !rep} onClick=${() => onRun(rep)}>Bestätigen und anlegen</button></div>
  </div></div>`;
}

/* ---------------- Arbeitsblätter als HTML (entsprechen den Pilot-PDFs) ---------------- */
const SHEET_CSS = `.sheet{border:1px solid #ccc;padding:24px;font-size:1.15rem;line-height:1.6;display:flex;flex-direction:column;gap:18px;color:#161616;background:#fff}.task{border:2px solid #222;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}.task-h{display:flex;justify-content:space-between;font-weight:700}.items{display:flex;flex-wrap:wrap;gap:14px 22px}.item{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:70px}.pic{font-size:2.2rem}.box{display:inline-flex;width:46px;height:46px;border:2px solid #222;border-radius:4px;align-items:center;justify-content:center;font-weight:700;font-size:1.4rem}.lines{height:44px;border-bottom:1.5px solid #222;border-top:1px solid #999}.sol{color:#1d4ea0;font-weight:700}.foot{font-size:.72rem;color:#666;border-top:1px solid #ccc;padding-top:6px}.namebox{display:flex;gap:16px}.namebox span{flex:1;border-bottom:1.5px solid #333}.dots{display:inline-grid;grid-template-columns:repeat(5,14px);gap:5px}.dots i{width:14px;height:14px;border-radius:50%;background:#222;display:block}`;
const Box = (sol, v) => html`<span class="box">${sol ? html`<span class="sol">${v}</span>` : ""}</span>`;
const Dots = (n) => html`<span class="dots" aria-label=${n + " Punkte"}>${Array.from({ length: n }, (_, i) => html`<i key=${i}></i>`)}</span>`;
const Task = (label, stars, instr, body) => html`<div class="task"><div class="task-h"><span>${label}</span><span class="stars" aria-label=${stars + " von 3 Sternen"}>${"★".repeat(stars)}${"☆".repeat(3 - stars)}</span></div><p>${instr}</p>${body}</div>`;
function Sheet(id, sol, m, title, children, withName = true) {
  return html`<div class="sheet" id=${"sheet-" + (sol ? "solution" : "main")}>
    <p class="meta">${SUBJECTS[TOPICS[m.topic_id].subject_id].title} · Klasse 1 · ${TOPICS[m.topic_id].title}</p>
    <h2>${title}${sol ? (m.type === "assessment" ? " – Auswertungshilfe" : " – Lösung") : ""}</h2>
    ${withName && !sol ? html`<div class="namebox"><span>Name:</span><span>Datum:</span></div>` : null}
    ${children}
    <p class="foot">Demonstrationsmaterial – nicht fachlich geprüft · selbst erstellt für den technischen Pilot · CC BY 4.0</p></div>`;
}
const Plan = (m, sol, title, parts) => Sheet(m.id, sol, m, title, html`<p><i>Unterrichtsplan für eine Unterrichtsstunde (45 Minuten)</i></p>${Object.entries(parts).map(([h, b]) => html`<div key=${h}><h3>${h}</h3>${Array.isArray(b) ? html`<ul>${b.map((x, i) => html`<li key=${i}>${x}</li>`)}</ul>` : html`<p>${b}</p>`}</div>`)}`, false);
const SHEETS = {
  d1: (sol, m) => Sheet(m.id, sol, m, "Anlaute hören", html`
    ${Task("Teil A", 1, "Sprich das Wort. Welchen Laut hörst du am Anfang? Kreise den Buchstaben ein.", html`<div class="items">${[["☀️", "Sonne", "M S B", "S"], ["🌙", "Mond", "M F A", "M"], ["⚽", "Ball", "E H B", "B"], ["🏠", "Haus", "H S M", "H"]].map(([p, w, c, a]) => html`<div class="item" key=${w}><span class="pic" role="img" aria-label=${w}>${p}</span><span>${c.split(" ").map(x => html`<span key=${x} style=${{ margin: "0 6px", ...(sol && x === a ? { border: "2px solid #1d4ea0", borderRadius: "50%", padding: "0 6px", color: "#1d4ea0" } : {}) }}>${x}</span>`)}</span>${sol ? html`<span class="sol small">${w}</span>` : null}</div>`)}</div>`)}
    ${Task("Teil B", 2, "Sprich das Wort. Schreibe den Anfangsbuchstaben in das Kästchen.", html`<div class="items">${[["🐟", "Fisch", "F"], ["🍎", "Apfel", "A"], ["🍦", "Eis", "E"], ["🐭", "Maus", "M"]].map(([p, w, a]) => html`<div class="item" key=${w}><span class="pic" role="img" aria-label=${w}>${p}</span>${Box(sol, a)}</div>`)}</div>`)}
    ${Task("Teil C", 3, "Finde ein eigenes Wort, das mit M anfängt. Male es und schreibe den ersten Buchstaben.", html`<div style=${{ border: "1.5px solid #222", minHeight: "110px", padding: "8px" }}>${sol ? html`<span class="sol">Beispiele: Maus, Mond, Mama, Milch, Möhre, Mütze</span>` : ""}</div>`)}`),
  d2: (sol, m) => Sheet(m.id, sol, m, "Der Buchstabe M m", html`

    ${Task("Teil B", 2, "Kreise alle M und m ein. Wie viele findest du?", html`<div style=${{ display: "grid", gridTemplateColumns: "repeat(4, 48px)", gap: "6px", fontSize: "1.6rem", fontWeight: 700 }}>${"M a m O t m L M o M e m M i s m".split(" ").map((c, i) => html`<span key=${i} style=${{ textAlign: "center", ...(sol && c.toLowerCase() === "m" ? { border: "2px solid #1d4ea0", borderRadius: "50%", color: "#1d4ea0" } : {}) }}>${c}</span>`)}</div><p>Ich finde ${Box(sol, "8")} M m.</p>`)}
    ${Task("Teil C", 3, "Lies die Wörter. Schreibe sie ab.", html`${["Mama", "Oma", "Mimi"].map(w => html`<div key=${w} style=${{ display: "flex", gap: "14px", alignItems: "flex-end" }}><b style=${{ fontSize: "1.5rem", minWidth: "90px" }}>${w}</b><div class="lines" style=${{ flex: 1 }}>${sol ? html`<span class="sol">${w}</span>` : ""}</div></div>`)}`)}`),
  d3: (sol, m) => Sheet(m.id, sol, m, "Silben schwingen und lesen", html`
    ${Task("Teil A", 1, "Sprich das Wort und klatsche dazu. Male für jede Silbe einen Kreis aus.", html`<div class="items">${[["☀️", "Sonne", "Son-ne", 2], ["🌙", "Mond", "Mond", 1], ["🍎", "Apfel", "Ap-fel", 2], ["🍅", "Tomate", "To-ma-te", 3]].map(([p, w, s, n]) => html`<div class="item" key=${w}><span class="pic" role="img" aria-label=${w}>${p}</span><span>${sol ? s : w}</span><span>${[0, 1, 2].map(k => html`<span key=${k} style=${{ display: "inline-block", width: "18px", height: "18px", borderRadius: "50%", border: "2px solid #222", margin: "0 3px", background: sol && k < n ? "#1d4ea0" : "transparent" }}></span>`)}</span></div>`)}</div>`)}

    ${Task("Teil C", 3, "Lies die Wörter mit Silbenbögen. Schreibe sie ab.", html`${["Ro-se", "La-ma", "Mo-na-te"].map(w => html`<div key=${w} style=${{ display: "flex", gap: "14px", alignItems: "flex-end" }}><b style=${{ fontSize: "1.4rem", minWidth: "120px" }}>${w.split("-").map((s, i) => html`<span key=${i} style=${{ borderBottom: "2px solid #222", borderRadius: "0 0 50% 50%", marginRight: "3px" }}>${s}</span>`)}</b><div class="lines" style=${{ flex: 1 }}>${sol ? html`<span class="sol">${w.replace(/-/g, "")}</span>` : ""}</div></div>`)}`)}`),
  d4: (sol, m) => Plan(m, sol, "Buchstaben schreiben: M und m", {

    "Voraussetzung": "Laut /m/ ist eingeführt; Kinder kennen die Lineatur mit Grund- und Mittellinie.",
    "Materialliste": ["Arbeitsblatt „Der Buchstabe M m“", "Tafel mit Lineatur", "Sandtablett oder Fühlbuchstaben", "Bleistift, Wachsmalkreide"],
    "Einstieg (10 Minuten)": ["Sitzkreis: Gegenstände mit /m/ aus einer Fühlkiste ertasten und benennen.", "M und m an der Tafel; Kinder schreiben in die Luft und auf den Rücken des Nachbarkindes."],
    "Arbeitsphase (25 Minuten)": ["Schwungübung (Bögen) mit Wachsmalkreide.", "Teil A des Arbeitsblatts, dann selbstständig in der Lineatur.", "Teil B: Buchstabenjagd; Teil C: Wörter abschreiben.", "Lehrkraft begleitet Stifthaltung und Bewegungsrichtung."],
    "Abschluss (10 Minuten)": ["Kinder zeigen ihren schönsten Buchstaben und begründen kurz.", "Gemeinsames Lesen: Mama, Oma, Mimi."],
    "Differenzierung": ["Basis: Buchstaben im Sand nachfahren, nur Teil A.", "Standard: Teil A und B.", "Erweitert: Teil C und eigene Wörter mit M."],

  d5: (sol, m) => sol ? Sheet(m.id, sol, m, "Gut zuhören", html`
    <p><i>Formative Lernstandskontrolle – keine amtlich vorgegebene Prüfung. Ergebnisse werden nicht in der Anwendung erfasst.</i></p>
    <div><h3>Vorlesetext (langsam, zweimal vorlesen)</h3><p>Mia geht in den Garten. Sie nimmt ihren roten Ball mit. Unter dem großen Baum liegt ein Apfel. Mia hebt den Apfel auf und isst ihn. Dann geht sie zum kleinen Teich. Im Wasser schwimmt ein Fisch. Mia winkt dem Fisch zu und läuft mit ihrem Ball nach Hause.</p></div>
    <div><h3>Lösungen</h3><ul><li>Aufgabe 1: Ball</li><li>Aufgabe 2: Apfel</li><li>Aufgabe 3: Fisch</li><li>Aufgabe 4: Mia winkt dem Fisch zu und läuft mit dem Ball nach Hause (sinngemäß).</li></ul></div>
    <div><h3>Beobachtungshinweise</h3><ul><li>Hört das Kind bis zum Ende zu?</li><li>3 von 3 richtig: sicher; 2: weitgehend; 0–1: Unterstützung anbieten.</li><li>Erzählt es in ganzen Sätzen und sinnvoller Reihenfolge?</li><li>Förderidee: mit Bildkarten nacherzählen; Fragen vorab stellen.</li></ul></div>`, false)
    : Sheet(m.id, sol, m, "Gut zuhören", html`<p>Deine Lehrerin oder dein Lehrer liest eine Geschichte vor. Hör gut zu.</p>
      ${[["Was nimmt Mia mit?", [["🍦", "Eis"], ["⚽", "Ball"], ["🐟", "Fisch"]]], ["Was liegt unter dem Baum?", [["🍎", "Apfel"], ["🌙", "Mond"], ["🏠", "Haus"]]], ["Was schwimmt im Teich?", [["☀️", "Sonne"], ["🐭", "Maus"], ["🐟", "Fisch"]]]].map(([q, o], i) =>
        html`<${React.Fragment} key=${i}>${Task("Aufgabe " + (i + 1), 1, q + " Kreuze das richtige Bild an.", html`<div class="items">${o.map(([p, w]) => html`<div class="item" key=${w}><span class="pic" role="img" aria-label=${w}>${p}</span><span class="box" style=${{ width: "30px", height: "30px" }}></span></div>`)}</div>`)}</${React.Fragment}>`)}
      ${Task("Aufgabe 4", 2, "Erzähle: Was macht Mia am Ende der Geschichte?", html`<p class="small">(mündlich – deine Lehrkraft hört zu)</p>`)}`),
  m1: (sol, m) => Sheet(m.id, sol, m, "Mengen zählen bis 10", html`

  m2: (sol, m) => Sheet(m.id, sol, m, "Zahlen vergleichen", html`
    ${Task("Teil A", 1, "Wo sind mehr Punkte? Kreise die größere Menge ein.", html`${[[4, 6], [8, 5], [3, 7]].map(([a, b], i) => html`<div key=${i} style=${{ display: "flex", gap: "40px" }}>${[a, b].map((n, k) => html`<span key=${k} style=${{ padding: "6px", ...(sol && n === Math.max(a, b) ? { border: "2px solid #1d4ea0", borderRadius: "12px" } : {}) }}>${Dots(n)}</span>`)}</div>`)}`)}
    ${Task("Teil B", 2, "Setze das richtige Zeichen ein: <  >  =", html`<div class="items">${[[5, 3], [2, 9], [6, 6], [10, 8]].map(([a, b], i) => html`<span key=${i} style=${{ fontSize: "1.6rem", fontWeight: 700, display: "flex", gap: "10px", alignItems: "center" }}>${a} ${Box(sol, a < b ? "<" : a > b ? ">" : "=")} ${b}</span>`)}</div>`)}

    ${Task("Teil B", 2, "Fülle das Zahlenhaus aus.", html`<div class="items">${[[6, [[1, 5, 1], [2, 4, 1], [3, 3, 0], [5, 1, 1]]], [8, [[7, 1, 1], [4, 4, 0], [2, 6, 1], [0, 8, 0]]]].map(([top, rows]) => html`<div key=${top} style=${{ textAlign: "center" }}><div style=${{ fontWeight: 700, fontSize: "1.4rem", borderBottom: "2px solid #222" }}>△ ${top}</div>${rows.map(([a, b, given], i) => html`<div key=${i} style=${{ display: "flex" }}>${given ? html`<span class="box">${a}</span>` : Box(sol, a)}${given ? Box(sol, b) : html`<span class="box">${b}</span>`}</div>`)}</div>`)}</div>`)}

  m4: (sol, m) => Plan(m, sol, "Plus und minus mit Plättchen", {
    "Lernziel": "Die Kinder verstehen Addition als Hinzufügen und Subtraktion als Wegnehmen und notieren passende Aufgaben bis 10.",
