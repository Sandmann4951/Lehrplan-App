[project]
name = "lehrplan-pilot"
version = "0.1.0"
description = "Unterrichtsassistent Bayern – lokaler Pilot (Variante A)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
